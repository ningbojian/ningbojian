name: Perm Probe

# 一次性实验（用完即删）：验证 GITHUB_TOKEN 能否把 workflow 文件改动推到新分支
# （决定「初始化 PR 免 PAT」方案是否成立）。结果写回 perm-probe-result.txt。
on:
  push:
    branches: [main]
    paths: [".github/workflows/perm-probe.yml"]

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Probe branch pushes with GITHUB_TOKEN
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A: 普通文件推新分支（基线，应当成功）
          git checkout -qb perm-probe-plain
          echo probe > plain.txt
          git add plain.txt
          git commit -qm "probe plain"
          a_err=$(git push -q origin perm-probe-plain 2>&1)
          a_rc=$?
          git checkout -q main

          # B: workflow 文件改动推新分支（关键问题）
          git checkout -qb perm-probe-wf
          printf '\n# probe-marker-1\n' >> .github/workflows/perm-probe.yml
          git add .github/workflows/perm-probe.yml
          git commit -qm "probe workflow change"
          b_err=$(git push -q origin perm-probe-wf 2>&1)
          b_rc=$?
          git checkout -q main

          {
            echo "PLAIN_OK=$a_rc"
            echo "PLAIN_ERR=$(printf '%s' "$a_err" | tr '\n' ' ')"
            echo "WF_OK=$b_rc"
            echo "WF_ERR=$(printf '%s' "$b_err" | tr '\n' ' ')"
          } > perm-probe-result.txt
          git add perm-probe-result.txt
          git commit -qm "probe result [skip ci]"
          git push -q origin main
