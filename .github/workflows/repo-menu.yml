name: 仓库选择板

# 用 GitHub 原生的任务清单（勾选框）选择要更新的仓库：
#   1. Actions 页面手动触发本 workflow → 创建/刷新一个「🎛 仓库更新选择板」Issue，列出全部公开仓库
#   2. 在 Issue 里勾选想更新的仓库，然后评论 /run → 只更新勾选的仓库
# （GitHub Actions 的触发界面没有多选框，这是网页上最接近的原生勾选体验）

on:
  workflow_dispatch:
  issue_comment:
    types: [created]

concurrency:
  group: repo-menu
  cancel-in-progress: false

permissions:
  contents: write      # 复用 update-profile 推提交/开 PR
  pull-requests: write
  issues: write        # 创建/编辑选择板 Issue、回帖

jobs:
  # ---- 1. 生成/刷新选择板 Issue（手动触发）----
  build-menu:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 渲染并更新选择板
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          cat > build_menu.py <<'PY'
          import json
          import os
          import sys

          owner = os.environ["OWNER"]
          repos = [json.loads(line) for line in sys.stdin if line.strip()]
          # 只放公开、非 fork、非 profile 自身的仓库（与工具默认过滤一致）
          repos = [
              r for r in repos
              if not r.get("private") and not r.get("fork")
              and r.get("full_name") != f"{owner}/{owner}"
          ]
          repos.sort(key=lambda r: (-r.get("stargazers_count", 0), r.get("name", "")))

          lines = [
              "<!-- repo-menu -->",
              "勾选想更新**项目介绍/简历素材**的仓库，然后在本 Issue 评论 **`/run`** 触发（仅仓库维护者有效）。",
              "",
              "> 主页 overview 与统计不受影响；「暂无描述」的补位短文案是自动的，不用勾。",
              "> 跑完可取消勾选，方便下次选择；仓库列表可在 Actions 的「仓库选择板」里重新生成。",
              "",
              "## 仓库列表（按 star 排序）",
              "",
          ]
          for r in repos:
              desc = (r.get("description") or "").replace("\n", " ").replace("\r", " ")[:60]
              parts = [f"- [ ] `{r['name']}` ⭐{r.get('stargazers_count', 0)}"]
              if r.get("language"):
                  parts.append(r["language"])
              if r.get("archived"):
                  parts.append("📦已归档")
              if desc:
                  parts.append(desc)
              lines.append(" · ".join(parts))
          if not repos:
              lines.append("（没有找到公开仓库）")
          sys.stdout.write("\n".join(lines) + "\n")
          PY
          gh api --paginate "users/${OWNER}/repos?per_page=100" --jq '.[] | @json' \
            | python3 build_menu.py > menu.md
          TITLE='🎛 仓库更新选择板'
          num=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file menu.md
            echo "已刷新选择板 Issue #${num}"
          else
            gh issue create --title "$TITLE" --body-file menu.md
          fi

  # ---- 2. 勾选后评论 /run：解析勾选的仓库 ----
  parse-checks:
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '<!-- repo-menu -->') &&
      contains(github.event.comment.body, '/run') &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.parse.outputs.repos }}
    steps:
      - name: 解析勾选的仓库
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > issue_body.md
          # 只提取勾选行（- [x]）反引号里的仓库名，字符集白名单防注入
          REPOS=$(sed -n 's/^- \[[xX]\] `\([A-Za-z0-9._-][A-Za-z0-9._-]*\)`.*/\1/p' issue_body.md | paste -sd, -)
          if [ -z "$REPOS" ]; then
            echo "::error::没有勾选任何仓库：请把想更新的仓库前的 [ ] 点成 [x]，再评论 /run"
            exit 1
          fi
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"
          echo "已勾选：$REPOS"

  # ---- 3. 复用主 workflow，只更新勾选的仓库 ----
  trigger-update:
    needs: parse-checks
    uses: ./.github/workflows/update-profile.yml
    with:
      projects_repos: ${{ needs.parse-checks.outputs.repos }}
    secrets: inherit

  # ---- 4. 回帖反馈结果 ----
  notify:
    needs: [parse-checks, trigger-update]
    if: always() && needs.parse-checks.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: 回帖反馈
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PARSE: ${{ needs.parse-checks.result }}
          UPD: ${{ needs.trigger-update.result }}
          REPOS: ${{ needs.parse-checks.outputs.repos }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UPD" = "success" ]; then
            body="✅ 已按勾选（$REPOS）触发更新。明细见 $RUN_URL（Summary 里有逐仓库表格）。跑完可取消勾选，方便下次选择。"
          elif [ "$PARSE" = "success" ]; then
            body="⚠️ 更新失败，请打开 $RUN_URL 查看日志。"
          else
            body="⚠️ 没有解析到勾选的仓库：请把想更新仓库前的 \`[ ]\` 点成 \`[x]\`，再评论 /run。详见 $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$body"
