name: Update Profile README

on:
  schedule:
    - cron: "23 2 * * 1" # 每周一 02:23 UTC ≈ 北京时间 10:23；改频率只需改这里
  workflow_dispatch:
    inputs:
      force:
        description: "忽略增量检测，强制重新生成"
        type: boolean
        default: false
      update_readme:
        description: "更新个人主页 overview"
        type: boolean
        default: true
      update_projects:
        description: "生成/更新项目介绍（简历素材）"
        type: boolean
        default: true

# 防止定时与手动同时运行；不取消进行中的运行
concurrency:
  group: update-profile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 不装任何依赖，纯 grep 判断定时开关
      - name: 检查定时开关（schedule.enabled）
        if: github.event_name == 'schedule'
        id: check
        run: |
          if grep -A3 '^schedule:' config.yaml | grep -qE 'enabled:[[:space:]]*false'; then
            echo "schedule=false" >> "$GITHUB_OUTPUT"
            echo "定时更新已关闭（config.yaml 中 schedule.enabled=false），本次跳过"
          else
            echo "schedule=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.schedule == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.schedule == 'true'
        run: pip install .

      - name: 读取配置路径
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.schedule == 'true'
        id: paths
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}
          print(f"readme={(c.get('readme') or {}).get('path', 'README.md')}")
          print(f"snapshot={(c.get('snapshot') or {}).get('path', 'data/snapshot.json')}")
          PY

      - name: 生成 README 与项目介绍
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.schedule == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
            [ "${{ inputs.update_readme }}" = "false" ] && FLAGS="$FLAGS --skip-readme"
            [ "${{ inputs.update_projects }}" = "false" ] && FLAGS="$FLAGS --skip-projects"
          fi
          python -m profile_agent --config config.yaml $FLAGS

      # 项目介绍（AI 生成内容）走 PR 人工审核；纯 README/统计更新直接提交
      - name: 提交变更（项目介绍有变化时开 PR 审核）
        if: github.event_name == 'workflow_dispatch' || steps.check.outputs.schedule == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ steps.paths.outputs.readme }}" "${{ steps.paths.outputs.snapshot }}"
          # docs/projects 不存在时不能进 git add 参数（pathspec 未匹配会让整个 add 失败）
          if [ -d docs/projects ]; then
            git add docs/projects
          fi
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
            exit 0
          fi
          review_via_pr=true
          grep -A6 '^projects:' config.yaml | grep -qE 'review_via_pr:[[:space:]]*false' && review_via_pr=false
          if [ "$review_via_pr" = "true" ] && ! git diff --cached --quiet -- docs/projects; then
            fingerprint=$(python3 -c "import json;print(json.load(open('${{ steps.paths.outputs.snapshot }}',encoding='utf-8')).get('stats_fingerprint',''))")
            # 同样内容此前被 Close 过 → 不再反复骚扰
            if gh pr list --state closed --head auto/profile-update --limit 30 --json body -q '.[].body' | grep -qF "$fingerprint"; then
              echo "这批内容上次审核未合并，本次跳过。如需重新生成：改 config.yaml 的 ai.prompt_version 后手动触发 force"
              git reset
              exit 0
            fi
            git checkout -B auto/profile-update
            git commit -m "feat: AI 项目介绍更新（待审核）[skip ci]"
            git push -u origin auto/profile-update --force
            if ! gh pr create --title "AI 项目介绍更新（待审核）" \
              --body "🤖 由 profile-agent 自动生成，请在 Diff 中审核 AI 写的项目介绍/简历素材，可直接编辑后 Merge；不想要就 Close（同批内容不会重复出现）。

          💡 如本页显示 conflict：重新运行一次本工作流即可自动解决（分支会基于最新 main 重建）。

          数据指纹: $fingerprint" \
              --head auto/profile-update --base main; then
              if gh pr view auto/profile-update >/dev/null 2>&1; then
                gh pr edit auto/profile-update --body "🤖 待审核更新（已刷新）。如显示 conflict 请重新运行工作流。数据指纹: $fingerprint"
              else
                echo "::error::创建 PR 被拒绝。请到仓库 Settings → Actions → General → Workflow permissions，勾选 Allow GitHub Actions to create and approve pull requests，然后重新运行本工作流。"
                exit 1
              fi
            fi
          else
            git commit -m "chore: 自动更新 Profile README [skip ci]"
            # 运行期间 main 可能被网页编辑推进过 → 自动 rebase 重试，避免非快失败
            pushed=false
            for i in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              echo "push 被拒绝（main 有新提交），第 $i 次 rebase 重试..."
              git pull --rebase origin main
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::push 失败（可能与 main 上的手工修改冲突），请打开本次运行日志检查，或手动合并后重新运行工作流"
              exit 1
            fi
          fi
