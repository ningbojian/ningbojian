name: Update Profile README

# 全部入口都在这一个 workflow 里：
#   - 定时（schedule）：每周自动更新
#   - 手动 Run workflow：立即更新；勾选「只生成/刷新选择板」则只维护勾选框 Issue
#   - 选择板 Issue 里勾选仓库后评论 /run：只重跑勾选的仓库
on:
  schedule:
    - cron: "23 2 * * 1" # 每周一 02:23 UTC ≈ 北京时间 10:23；改频率只需改这里
  workflow_dispatch:
    inputs:
      force:
        description: "忽略增量检测，强制重新生成"
        type: boolean
        default: false
      update_readme:
        description: "更新个人主页 overview"
        type: boolean
        default: true
      update_projects:
        description: "生成/更新项目介绍（简历素材）"
        type: boolean
        default: true
      projects_repos:
        description: "点名要更新的仓库（逗号分隔仓库名，如 shiyuan,agri-ecommerce-platform）；留空=按 config 的 include/exclude；填 all=全部精选"
        type: string
        default: ""
      build_board:
        description: "只生成/刷新「仓库选择板」Issue（勾选框列表），本次不执行更新"
        type: boolean
        default: false
  issue_comment:
    types: [created]

# 防止定时/手动/勾选板同时运行；不取消进行中的运行
concurrency:
  group: update-profile
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write        # 创建/编辑选择板 Issue、回帖

jobs:
  # ---- 选择板 Issue 里评论 /run：解析勾选的仓库 ----
  parse-checks:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.state == 'open' &&
      contains(github.event.issue.body, '<!-- repo-menu -->') &&
      contains(github.event.comment.body, '/run') &&
      github.event.comment.user.login != 'github-actions[bot]' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.parse.outputs.repos }}
    steps:
      - name: 解析勾选的仓库
        id: parse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          gh issue view "$ISSUE_NUMBER" --json body --jq .body > issue_body.md
          # 只提取勾选行（- [x]）反引号里的仓库名，字符集白名单防注入
          REPOS=$(sed -n 's/^- \[[xX]\] `\([A-Za-z0-9._-][A-Za-z0-9._-]*\)`.*/\1/p' issue_body.md | paste -sd, -)
          if [ -z "$REPOS" ]; then
            echo "::error::没有勾选任何仓库：请把想更新的仓库前的 [ ] 点成 [x]，再评论 /run"
            exit 1
          fi
          echo "repos=$REPOS" >> "$GITHUB_OUTPUT"
          echo "已勾选：$REPOS"

  # ---- 手动触发且勾选 build_board：生成/刷新选择板 Issue ----
  build-board:
    if: github.event_name == 'workflow_dispatch' && inputs.build_board
    runs-on: ubuntu-latest
    steps:
      - name: 渲染并更新选择板
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          cat > build_menu.py <<'PY'
          import json
          import os
          import sys

          owner = os.environ["OWNER"]
          repos = [json.loads(line) for line in sys.stdin if line.strip()]
          # 只放公开、非 fork、非 profile 自身的仓库（与工具默认过滤一致）
          repos = [
              r for r in repos
              if not r.get("private") and not r.get("fork")
              and r.get("full_name") != f"{owner}/{owner}"
          ]
          repos.sort(key=lambda r: (-r.get("stargazers_count", 0), r.get("name", "")))

          lines = [
              "<!-- repo-menu -->",
              "勾选想更新**项目介绍/简历素材**的仓库，然后在本 Issue 评论 **`/run`** 触发（仅仓库维护者有效）。",
              "",
              "> 主页 overview 与统计不受影响；「暂无描述」的补位短文案是自动的，不用勾。",
              "> 勾选的仓库会**强制重新生成**（即使数据没变）；跑完可取消勾选，方便下次选择。",
              "> 仓库列表可在 Actions → Update Profile README → Run workflow → 勾选「只生成/刷新选择板」重新生成。",
              "",
              "## 仓库列表（按 star 排序）",
              "",
          ]
          for r in repos:
              desc = (r.get("description") or "").replace("\n", " ").replace("\r", " ")[:60]
              parts = [f"- [ ] `{r['name']}` ⭐{r.get('stargazers_count', 0)}"]
              if r.get("language"):
                  parts.append(r["language"])
              if r.get("archived"):
                  parts.append("📦已归档")
              if desc:
                  parts.append(desc)
              lines.append(" · ".join(parts))
          if not repos:
              lines.append("（没有找到公开仓库）")
          sys.stdout.write("\n".join(lines) + "\n")
          PY
          gh api --paginate "users/${OWNER}/repos?per_page=100" --jq '.[] | @json' \
            | python3 build_menu.py > menu.md
          TITLE='🎛 仓库更新选择板'
          num=$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -1)
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file menu.md
            echo "已刷新选择板 Issue #${num}"
          else
            gh issue create --title "$TITLE" --body-file menu.md
          fi

  # ---- 主更新（定时 / 手动 / 勾选板 /run 三条路都走这里）----
  update:
    needs: [parse-checks, build-board]
    if: >
      always() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && !inputs.build_board && needs.build-board.result == 'skipped') ||
        (github.event_name == 'issue_comment' && needs.parse-checks.result == 'success')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 不装任何依赖，纯 grep 判断定时开关
      - name: 检查定时开关（schedule.enabled）
        if: github.event_name == 'schedule'
        id: check
        run: |
          if grep -A3 '^schedule:' config.yaml | grep -qE 'enabled:[[:space:]]*false'; then
            echo "schedule=false" >> "$GITHUB_OUTPUT"
            echo "定时更新已关闭（config.yaml 中 schedule.enabled=false），本次跳过"
          else
            echo "schedule=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        run: pip install .

      - name: 读取配置路径
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        id: paths
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          c = yaml.safe_load(open('config.yaml', encoding='utf-8')) or {}
          print(f"readme={(c.get('readme') or {}).get('path', 'README.md')}")
          print(f"snapshot={(c.get('snapshot') or {}).get('path', 'data/snapshot.json')}")
          PY

      - name: 生成 README 与项目介绍
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 勾选板 /run 时是勾选的仓库；手动触发时是 projects_repos 输入；定时为空
          INPUT_REPOS: ${{ needs.parse-checks.outputs.repos || inputs.projects_repos }}
        run: |
          # 手动触发时 inputs 才有值；定时/勾选板跑时为空，不加对应 flag
          FLAGS=""
          [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          [ "${{ inputs.update_readme }}" = "false" ] && FLAGS="$FLAGS --skip-readme"
          [ "${{ inputs.update_projects }}" = "false" ] && FLAGS="$FLAGS --skip-projects"
          # 点名仓库：只保留仓库名安全字符，防 shell 注入
          if [ -n "$INPUT_REPOS" ]; then
            CLEAN=$(printf '%s' "$INPUT_REPOS" | tr -cd 'A-Za-z0-9,._-')
            [ -n "$CLEAN" ] && FLAGS="$FLAGS --repos $CLEAN"
          fi
          python -m profile_agent --config config.yaml $FLAGS

      # 项目介绍（AI 生成内容）走 PR 人工审核；纯 README/统计更新直接提交
      - name: 提交变更（项目介绍有变化时开 PR 审核）
        if: github.event_name != 'schedule' || steps.check.outputs.schedule == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          review_via_pr=true
          grep -A6 '^projects:' config.yaml | grep -qE 'review_via_pr:[[:space:]]*false' && review_via_pr=false

          # 项目介绍是否有变化（目录可能不存在，status 比 staged 判断更稳）
          projects_changed=false
          if [ -d docs/projects ] && [ -n "$(git status --porcelain -- docs/projects)" ]; then
            projects_changed=true
          fi

          # 走 PR 时分支里只放 docs/projects：README/统计直接进 main，
          # 两者文件永不相交 → PR 开着期间 main 再怎么更新都不会产生冲突
          pr_route=false
          if [ "$review_via_pr" = "true" ] && [ "$projects_changed" = "true" ]; then
            pr_route=true
          fi

          git add "${{ steps.paths.outputs.readme }}" "${{ steps.paths.outputs.snapshot }}"
          if [ "$pr_route" = "false" ] && [ "$projects_changed" = "true" ]; then
            git add docs/projects
          fi

          has_direct=false
          if ! git diff --cached --quiet; then
            has_direct=true
          fi
          if [ "$has_direct" = "false" ] && [ "$pr_route" = "false" ]; then
            echo "无变更，跳过提交"
            exit 0
          fi

          # ---- 1. 直接提交 main：README/统计（非 PR 模式下也含项目介绍）----
          if [ "$has_direct" = "true" ]; then
            git commit -m "chore: 自动更新 Profile README [skip ci]"
            pushed=false
            for i in 1 2 3; do
              if git push; then
                pushed=true
                break
              fi
              echo "push 被拒绝（main 有新提交），第 $i 次 rebase 重试..."
              # autostash：PR 模式下工作区还有未暂存的 docs 改动，rebase 前要先收起来
              git pull --rebase --autostash origin main
              sleep 5
            done
            if [ "$pushed" != "true" ]; then
              echo "::error::push 失败（可能与 main 上的手工修改冲突），请打开本次运行日志检查，或手动合并后重新运行工作流"
              exit 1
            fi
          fi

          # ---- 2. 项目介绍走 PR 人工审核（分支只含 docs/projects）----
          if [ "$pr_route" = "true" ]; then
            fingerprint=$(python3 -c "import json;print(json.load(open('${{ steps.paths.outputs.snapshot }}',encoding='utf-8')).get('stats_fingerprint',''))")
            # 只有「closed 且未合并」（你点了 Close 拒绝）的 PR 才算拒绝过；
            # merged 的 PR 也是 closed 状态，不能算，否则合并过的批次会永远压制后续生成
            if gh pr list --state closed --head auto/profile-update --limit 30 --json body,mergedAt \
                -q '.[] | select(.mergedAt == null) | .body' | grep -qF "$fingerprint"; then
              echo "这批内容上次被 Close 拒绝过，本次跳过。如需重新生成：改 config.yaml 的 ai.prompt_version 后手动触发 force"
              exit 0
            fi
            git checkout -B auto/profile-update
            git add docs/projects
            git commit -m "feat: AI 项目介绍更新（待审核）[skip ci]"
            git push -u origin auto/profile-update --force
            echo "已推送分支 auto/profile-update（PR 将基于最新 main，无冲突）"
            if ! gh pr create --title "AI 项目介绍更新（待审核）" \
              --body "🤖 由 profile-agent 自动生成，请在 Diff 中审核 AI 写的项目介绍/简历素材，可直接编辑后 Merge；不想要就 Close（同批内容不会重复出现）。

          本 PR 只包含 docs/projects（简历素材），主页 README/统计的更新都已直接进 main，不会被本 PR 拖住。

          💡 如本页显示 conflict：重新运行一次本工作流即可自动解决（分支会基于最新 main 重建）。

          数据指纹: $fingerprint" \
              --head auto/profile-update --base main; then
              if gh pr view auto/profile-update >/dev/null 2>&1; then
                gh pr edit auto/profile-update --body "🤖 待审核更新（只含 docs/projects，已刷新）。如显示 conflict 请重新运行工作流。数据指纹: $fingerprint"
              else
                echo "::error::创建 PR 被拒绝。请到仓库 Settings → Actions → General → Workflow permissions，勾选 Allow GitHub Actions to create and approve pull requests，然后重新运行本工作流。"
                exit 1
              fi
            fi
          fi

  # ---- 勾选板 /run 后回帖反馈结果 ----
  notify:
    needs: [parse-checks, update]
    if: always() && github.event_name == 'issue_comment' && needs.parse-checks.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: 回帖反馈
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PARSE: ${{ needs.parse-checks.result }}
          UPD: ${{ needs.update.result }}
          REPOS: ${{ needs.parse-checks.outputs.repos }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$UPD" = "success" ]; then
            body="✅ 已按勾选（$REPOS）重新生成。明细见 $RUN_URL（Summary 里有逐仓库表格）。跑完可取消勾选，方便下次选择。"
          elif [ "$PARSE" = "success" ]; then
            body="⚠️ 更新失败，请打开 $RUN_URL 查看日志。"
          else
            body="⚠️ 没有解析到勾选的仓库：请把想更新仓库前的 \`[ ]\` 点成 \`[x]\`，再评论 /run。详见 $RUN_URL"
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$body"
