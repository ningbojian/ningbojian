# GitHub Overview Auto Agent 配置文件
# 使用指南见 docs/guide.md

schedule:
  enabled: true # false = 关闭定时自动更新（GitHub Actions 手动触发仍可用）

github:
  username: "ningbojian" # 必填：你的 GitHub 用户名
  token_env: "GITHUB_TOKEN" # token 所在环境变量名（Actions 内置 GITHUB_TOKEN 即可）

repos:
  exclude_forks: true
  exclude_archived: false
  exclude: [] # 仓库名黑名单，如 ["you/you"]（profile 仓库自身）

featured:
  count: 0 # 上主页的项目数上限；0 = 全部
  min_stars: 0
  recency_days: 0 # 只考虑此时间内有 push 的仓库；0 = 不限（与 count: 0 配合 = 真·全部）
  sort_by: "score" # score | stars | updated
  score_stars_weight: 1.0
  score_recency_weight: 0.5
  pin: [] # 兜底种子（full_name 或裸名，如 ["you/cool-tool"]）：仅当无法读取原生 Pinned（本地无 token、GraphQL 失败且无快照）时生效；正常跟随 GitHub 主页 Customize your pins 的顺序

readme:
  enabled: true # false = 不更新个人主页 overview
  path: "README.md"
  template: "templates/profile.md.j2"
  cards:
    theme: "github_dark"
    show: ["stats", "top_langs", "streak"] # 可选: stats, top_langs, streak
  include_update_time: true
  visitors_badge: true # 主页嵌入「主页访问量」计数徽章（komarev.com 免费第三方服务，页面渲染一次 +1）
  bilingual: true # 同时生成 README.en.md（英文版），两文件顶部互链切换；false = 只更新中文 README.md
  mode: "auto" # 手写 README 的保护策略：auto = 只在第一个标题后插/更新一个 AI 简介块，其余字节不动（默认）；full = 整页接管（有 WORKFLOW_PAT 才先开预览 PR，没有则跳过本轮）
  sections: # 板块开关（默认全开）：只隐藏生成区，不动手写/custom 内容
    bio: true # 简介
    stats: true # 统计卡与技术标签
    pinned: true # 📌 置顶项目（关掉后这些仓库回到下方列表）
    table: false # 📦 仓库列表：false = 只展示 GitHub 主页 Pinned 的那几个，不列全部仓库（与 pinned 都关 → 不输出任何仓库区块）

ai:
  enabled: true
  # provider: "anthropic" = Claude 官方 key（ANTHROPIC_API_KEY）
  # provider: "openai"    = 任意 OpenAI 兼容接口：DeepSeek / 通义千问 / Kimi / MiMo / Ollama 等
  #   openai 模式示例（用 MiMo 时把 base_url 换成 MiMo 开通页文档里的接口地址）：
  #   provider: "openai"
  #   base_url: "https://api.deepseek.com"   ← 填你服务商的地址（通常含 /v1）
  #   key_env: "AI_API_KEY"                ← secret 名字（workflow 已内置注入，建议就叫这个）
  #   model: "mimo-..."                      ← 填服务商文档里的模型名
  provider: "anthropic"
  base_url: "https://api.xiaomimimo.com/anthropic"
  key_env: "AI_API_KEY"
  model: "mimo-v2.6-flash" # 降本可改 "claude-haiku-5-5"
  max_repos: 15 # 喂给模型的仓库数上限
  max_age_days: 14 # 简介最长复用天数，超过才重新生成
  bio_min_chars: 100
  bio_max_chars: 150
  language: "zh-CN"
  prompt_version: 2 # 改 prompt 时 +1，强制重新生成简介（2：移除简介末尾「亮点：」小节）

# 模式 B：各仓库 README 托管区自动更新（代码提交 → AI 更新该仓库 README → 开 PR 审核；
# 主页只有缺描述仓库的一句话简介会随后吸收，统计与其余内容不依赖合并）
# 开启需配置 WORKFLOW_PAT secret。当前为全量：所有公开仓库有新提交即触发（灰度期已过）。
repo_readmes:
  enabled: true
  include: [] # 空 = 按 repos 过滤规则的全部仓库（灰度已结束，全量启用）
  exclude: ["ningbojian/ProfileReadmeAgent"] # 模板仓库自身：README 是给用户的说明页，不自动改写
  max_diff_chars: 6000 # 喂给模型的 diff 字符上限
  prompt_version: 2 # 改模式 B 的 prompt 时 +1，强制重新生成（2026-10-23 嵌入原 README 修订基础）
  pr_branch: "readme-auto/update" # PR 分支名；主页从这里读未合并内容

# 仓库描述自动写回（默认关闭）：仓库有新推送时，用 AI 重写 GitHub 上的 description。
# 需要 WORKFLOW_PAT（classic，repo scope）。第一次见到仓库只记基线、不改；
# 你在 GitHub 上手动改过的描述会被永久跳过；每轮最多写 5 个。
repo_descriptions:
  enabled: false
  include: [] # 空 = 全部公开仓库（profile 仓库自身始终排除）
  exclude: [] # 在 include 之上再排除

snapshot:
  path: "data/snapshot.json"
